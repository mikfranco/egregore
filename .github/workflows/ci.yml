name: CI

# One planner routes the existing strict owners. Release candidates and full
# runs are selected by the planner from the event and requested mode.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
  workflow_dispatch:
    inputs:
      mode:
        description: Affected checks or the complete suite
        type: choice
        options: [affected, full]
        default: full
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.mode || 'affected' }}
  cancel-in-progress: true

jobs:
  plan:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    uses: ./.github/workflows/ci-plan.yml
    with:
      workflow: all
      mode: ${{ inputs.mode || 'affected' }}

  shell-contracts:
    needs: plan
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.plan.result != 'success' || needs.plan.outputs.shell_contracts == 'true') }}
    name: Strict shell contracts
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Require successful CI plan
        env:
          CI_PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$CI_PLAN_RESULT" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install shell suite dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zsh procps util-linux
          # Missing Zsh must fail here, not become a passing coverage skip.
          for tool in bash jq zsh pgrep setsid; do command -v "$tool"; done

      - name: Syntax check — all shell scripts
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: |
          FAIL=0
          for f in bin/*.sh bin/lib/*.sh; do
            if ! bash -n "$f" 2>/dev/null; then
              echo "FAIL: $f"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: No hardcoded internal references
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: |
          # Check bin/ scripts for Curve-Labs references (should be parameterized)
          FOUND=$(grep -rn "Curve-Labs\|curve-labs\|curvelabs" bin/ --include='*.sh' | grep -v 'test-' || true)
          if [ -n "$FOUND" ]; then
            echo "Found internal references in bin/ scripts:"
            echo "$FOUND"
            exit 1
          fi

      - name: No unsafe .env sourcing
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: |
          FOUND=$(grep -rn 'source.*\.env' bin/ --include='*.sh' | grep -v 'test-' | grep -v '#' || true)
          if [ -n "$FOUND" ]; then
            echo "Found unsafe 'source .env':"
            echo "$FOUND"
            exit 1
          fi

      # Under pipefail, grep -q exits at its first match and the printf or
      # echo feeding it can die with a broken pipe, failing a passing check
      # at random. Tests read a variable with `grep -q PATTERN <<< "$VAR"`.
      - name: No echo or printf piped into grep -q under pipefail
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: |
          FOUND=$(grep -l pipefail bin/tests/*.sh tests/*.sh | xargs grep -nE '(printf .%s[^ ]*|echo) .\$[^ ]* \| *grep -[A-Za-z]*q' | grep -vE '^[^:]+:[0-9]+: *#' || true)
          if [ -n "$FOUND" ]; then
            echo "Found a pipe into grep -q under pipefail (use grep -q PATTERN <<< \"\$VAR\"):"
            echo "$FOUND"
            exit 1
          fi

      - name: No manual JSON construction
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: |
          FOUND=$(grep -rn '"{\\\"' bin/ --include='*.sh' | grep -v 'test-' || true)
          if [ -n "$FOUND" ]; then
            echo "Found manual JSON construction (use jq -n):"
            echo "$FOUND"
            exit 1
          fi

      - name: Local mode graceful degradation
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: |
          FAIL=0
          for script in bin/graph.sh bin/notify.sh bin/graph-op.sh; do
            if [ -f "$script" ] && ! grep -q '"local"' "$script" 2>/dev/null; then
              echo "FAIL: $script missing local mode handling"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Commands have valid structure
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: |
          FAIL=0
          COMMAND_FILES=$(find .claude/commands -name '*.md' -type f 2>/dev/null || true)
          if [ -z "$COMMAND_FILES" ]; then
            COMMAND_FILES=$(find .claude/skills -name 'SKILL.md' -type f 2>/dev/null || true)
          fi
          if [ -z "$COMMAND_FILES" ]; then
            echo "FAIL: no Claude command or skill files found"
            exit 1
          fi
          while IFS= read -r cmd; do
            [ -n "$cmd" ] || continue
            # Every command should have content (not empty)
            LINES=$(wc -l < "$cmd" | tr -d ' ')
            if [ "$LINES" -lt 3 ]; then
              echo "FAIL: $cmd is too short ($LINES lines)"
              FAIL=1
            fi
          done <<< "$COMMAND_FILES"
          echo "Checked $(echo "$COMMAND_FILES" | wc -l | tr -d ' ') command/skill files"
          exit $FAIL

      - name: Harvest question palette contract
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash tests/test-harvest-question-palette.sh

      - name: Convention parity (commit/PR format paragraphs)
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash tests/test-convention-parity.sh

      - name: Run worktree tests
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash tests/test-worktree.sh

      - name: Run agent protocol smoke test
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash tests/test-agent-protocol.sh

      - name: Test greeting in Bash and Zsh
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash tests/test-greeting-notices.sh

      - name: Test pending-turn greeting projection
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash tests/test-greeting-pending-turns.sh

      - name: Test runtime mode status
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash bin/tests/test-runtime-mode-status.sh

      - name: Test boundary consent guidance
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash bin/tests/test-boundary-check-askuserquestion.sh

      - name: Test instance isolation topologies
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash bin/tests/test-boundary-instance-isolation.sh

      - name: Test retrieval output hygiene
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash bin/tests/test-retrieval-output-hygiene.sh

      - name: Test runtime launch path
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash bin/tests/test-runtime-launch-path.sh

      - name: Test card output hygiene
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash bin/tests/test-card-output-hygiene.sh

      - name: Test prose rule contract
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash bin/tests/test-prose-check.sh

      - name: Activity and handoff lifecycle
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash tests/test-handoff-activity-lifecycle.sh

      - name: CI suite ownership
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash tests/test-ci-test-ownership.sh

      - name: CI shard partition
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash tests/test-suite-shard.sh

  artifacts-tests:
    needs: plan
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.plan.result != 'success' || needs.plan.outputs.artifacts == 'true') }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env:
      TZ: UTC
      LC_ALL: C.UTF-8
      NODE_ENV: ''
      NODE_OPTIONS: ''
    steps:
      - name: Require successful CI plan
        env:
          CI_PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$CI_PLAN_RESULT" = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test distributed view rendering suite
        run: bash bin/tests/test-view-render.sh

      - name: Test distributed artifact dark mode suite
        run: bash bin/tests/test-artifact-dark-mode.sh

  runtime-parity:
    needs: plan
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.plan.result != 'success' || needs.plan.outputs.runtime == 'true') }}
    name: Runtime contracts
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Require successful CI plan
        env:
          CI_PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$CI_PLAN_RESULT" = success
      - uses: actions/checkout@v4
        with:
          # Frozen evaluation export verifies the manifest's original commit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install focused test dependencies
        run: python -m pip install pytest==9.0.2 PyYAML==6.0.3

      - name: Require Runtime fixture capabilities
        run: |
          for tool in git jq shasum; do command -v "$tool"; done
          python - <<'PY'
          import os
          import pty
          import socket

          master, slave = pty.openpty()
          os.close(master)
          os.close(slave)
          with socket.socket() as listener:
              listener.bind(("127.0.0.1", 0))
          PY

      - name: test-bundle-skill-scripts
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash bin/tests/test-bundle-skill-scripts.sh

      - name: test-codex-native-skills
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash bin/tests/test-codex-native-skills.sh

      - name: test-codex-spec-render
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash bin/tests/test-codex-spec-render.sh

      - name: Verify strict Runtime skill migration contracts
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash tests/test-runtime-skill-migration.sh

  postgres-proofs:
    needs: plan
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.plan.result != 'success' || needs.plan.outputs.api_postgres == 'true') }}
    name: Emissary PostgreSQL 16 proofs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require successful CI plan
        env:
          CI_PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$CI_PLAN_RESULT" = success
      - uses: actions/checkout@v4

      - name: Prove handle security and concurrency contracts
        run: bash tests/test-handle-claim-pg16.sh

      - name: Prove data-plane security and concurrency contracts
        run: bash tests/test-emissary-data-plane-hardening-pg16.sh

      - name: Prove donation-ingestion security and concurrency contracts
        run: bash tests/test-emissary-donation-ingestion-pg16.sh

  baseline:
    needs: plan
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.plan.result != 'success' || needs.plan.outputs.baseline == 'true') }}
    name: Suite baseline — shard ${{ matrix.shard }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.baseline_shards || '[0]') }}
    steps:
      - name: Require successful CI plan
        env:
          CI_PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$CI_PLAN_RESULT" = success
      # Full history supports suites that compute merge-bases.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install baseline suite dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zsh procps lsof rsync util-linux
          # Process inspection and cleanup are required proofs, never optional skips.
          for tool in bash git python3 node jq zsh perl tar pgrep ps lsof rsync shasum setsid; do command -v "$tool"; done
          python3 -c 'import sys; sys.exit(sys.version_info < (3, 11))'
          node -e 'process.exit(Number(process.versions.node.split(".")[0]) < 22 ? 1 : 0)'
      - name: Run distributed shell suites
        shell: bash
        env:
          BASELINE_SUITES: ${{ needs.plan.outputs.baseline_suites }}
          BASELINE_SHARD_COUNT: ${{ needs.plan.outputs.baseline_shard_count }}
        run: |
          printf '%s\n' "$BASELINE_SUITES" > "$RUNNER_TEMP/baseline-selection.json"
          bash bin/suite-shard.sh --exclude-owned --selected "$RUNNER_TEMP/baseline-selection.json" ${{ matrix.shard }} "$BASELINE_SHARD_COUNT" > selected-suites.txt
          mkdir -p suite-logs
          status=0
          while IFS= read -r suite; do
            log="suite-logs/${suite//\//_}.log"
            if timeout --kill-after=10s 300s bash "$suite" < /dev/null > "$log" 2>&1; then
              printf 'PASS %s\n' "$suite"
            else
              code=$?
              printf 'FAIL %s (exit %s)\n' "$suite" "$code"
              cat "$log"
              status=1
            fi
          done < selected-suites.txt > suite-baseline.txt
          cat suite-baseline.txt
          cat suite-baseline.txt >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload baseline report
        if: ${{ always() && needs.plan.result == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: suite-baseline-shard-${{ matrix.shard }}
          path: |
            suite-baseline.txt
            suite-logs/
          if-no-files-found: ignore
          retention-days: 7

  shellcheck:
    needs: plan
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.plan.result != 'success' || needs.plan.outputs.shellcheck == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful CI plan
        env:
          CI_PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$CI_PLAN_RESULT" = success
      - uses: actions/checkout@v4

      - name: Run ShellCheck on bin/ scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './bin'
          severity: error
          format: gcc

  full-result:
    name: Full CI result — ${{ github.sha }}
    needs:
      - plan
      - shell-contracts
      - artifacts-tests
      - runtime-parity
      - postgres-proofs
      - baseline
      - shellcheck
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.plan.result != 'success' || needs.plan.outputs.baseline_strict == 'true') }}
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Require every full-suite owner to pass
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          required = {
              "plan", "shell-contracts", "artifacts-tests",
              "runtime-parity",
              "postgres-proofs",
              "baseline", "shellcheck",
          }
          results = json.loads(os.environ["CI_NEEDS_JSON"])
          if set(results) != required:
              sys.exit("Full CI evidence is incomplete")
          failed = sorted(name for name in required if results[name].get("result") != "success")
          if failed:
              sys.exit("Full CI did not pass: " + ", ".join(failed))
          print("Every full-suite owner passed")
          PY
